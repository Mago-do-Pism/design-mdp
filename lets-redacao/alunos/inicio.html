  <style>
    a { color: inherit; text-decoration: none; }
    .notif-carousel { max-width: 600px; position: relative; }
    .notif-slide { display: none; }
    .notif-slide.active { display: block; }
    .notif-img {
      width: 100%; aspect-ratio: 16/9; border-radius: 12px;
      object-fit: cover; background: var(--brand-primary);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .notif-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
    .notif-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--brand-primary-dot-inactive); cursor: pointer; transition: all 0.2s;
    }
    .notif-dot.active { width: 22px; border-radius: 4px; background: var(--brand-primary); }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo" role="img" aria-label="Lets Redação"></div>

        <a href="redacoes.html" class="sidebar-item">

          <span>Redações</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <a href="perfil.html" class="sidebar-item"><svg width="22" height="22" viewBox="0 0 25 25" fill="none"><path d="M19.7917 21.875V19.7917C19.7917 18.6866 19.3527 17.6268 18.5713 16.8454C17.7899 16.064 16.7301 15.625 15.625 15.625H9.375C8.26993 15.625 7.21013 16.064 6.42872 16.8454C5.64732 17.6268 5.20834 18.6866 5.20834 19.7917V21.875M16.6667 7.29167C16.6667 9.59285 14.8012 11.4583 12.5 11.4583C10.1988 11.4583 8.33334 9.59285 8.33334 7.29167C8.33334 4.99048 10.1988 3.125 12.5 3.125C14.8012 3.125 16.6667 4.99048 16.6667 7.29167Z" stroke="#FCFCFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Meu Perfil</span></a>

    <main class="content student-content-zero" style="overflow-y:auto;">

      <!-- Avisos -->
      <h4 class="text-primary ps-4 ps-md-5 pt-4 pt-md-5 mb-4">Avisos</h4>
      <div class="ps-4 ps-md-5" style="padding-right:1.5rem;">
        <div class="notif-carousel" id="carousel">
          <div class="notif-slide active">
            <div class="notif-img" style="background:linear-gradient(135deg,#A94DCE,#C07DDB);">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            </div>
          </div>
          <div class="notif-slide">
            <div class="notif-img" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            </div>
          </div>
          <div class="notif-slide">
            <div class="notif-img" style="background:linear-gradient(135deg,#278556,#21C230);">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            </div>
          </div>
          <div class="notif-dots" id="dots">
            <span class="notif-dot active" onclick="goTo(0)"></span>
            <span class="notif-dot" onclick="goTo(1)"></span>
            <span class="notif-dot" onclick="goTo(2)"></span>
          </div>
        </div>
      </div>

      <!-- Jornada -->
      <div class="col-12 mt-4 pb-4 pb-md-5">
        <h4 class="text-primary ps-4 ps-md-5 pb-3">Jornada</h4>
        <div class="swiper-row ps-4 ps-md-5">
          <div class="swiper-item">
            <div class="cc-wrap has-color-border" style="border-left-color:#C07DDB;">
              <div class="cc-img" style="background:linear-gradient(160deg,#A94DCE 0%,#C07DDB 100%);"></div>
              <div class="p-2 text-center"><span class="body-1 text-secondary">Redação Nota 1000</span></div>
            </div>
          </div>
          <div class="swiper-item">
            <div class="cc-wrap has-color-border" style="border-left-color:#6366f1;">
              <div class="cc-img" style="background:linear-gradient(160deg,#5856d6 0%,#6366f1 100%);"></div>
              <div class="p-2 text-center"><span class="body-1 text-secondary">Redação ENEM</span></div>
            </div>
          </div>
          <div class="swiper-item">
            <div class="cc-wrap has-color-border" style="border-left-color:#278556;">
              <div class="cc-img" style="background:linear-gradient(160deg,#1a6b43 0%,#278556 100%);"></div>
              <div class="p-2 text-center"><span class="body-1 text-secondary">Turma Regular</span></div>
            </div>
          </div>
          <div class="swiper-item">
            <div class="cc-wrap has-color-border" style="border-left-color:#d97706;">
              <div class="cc-img" style="background:linear-gradient(160deg,#b45309 0%,#d97706 100%);"></div>
              <div class="p-2 text-center"><span class="body-1 text-secondary">Oficina de Argumentação</span></div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    let current = 0;
    const slides = document.querySelectorAll('.notif-slide');
    const dots = document.querySelectorAll('.notif-dot');

    function goTo(n) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = n;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    setInterval(() => goTo((current + 1) % slides.length), 5000);
  </script>
</body>
</html>
