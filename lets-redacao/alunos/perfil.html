  <style>
    a { color: inherit; text-decoration: none; }
    .avatar-wrap {
      position: relative; width: 120px; height: 120px;
      border-radius: 50%; overflow: visible; flex-shrink: 0;
    }
    .avatar-circle {
      width: 120px; height: 120px; border-radius: 50%;
      background: var(--neutral-300); overflow: hidden;
      box-shadow: 0 0 12px var(--brand-primary-avatar-glow);
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-circle svg { width: 64px; height: 64px; color: var(--text-muted); }
    .avatar-edit-btn {
      position: absolute; right: -4px; bottom: -4px;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--brand-primary); color: white;
      border: 3px solid var(--neutral-50);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .avatar-edit-btn svg { width: 16px; height: 16px; }
    .logout-row {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; color: var(--color-danger);
      margin-top: auto; padding-top: 2rem;
    }
    .logout-row svg { width: 24px; height: 24px; }
    .logout-row h6 { margin: 0; font-size: 16px; font-weight: 600; }
  </style>
</head>

      <div class="row" style="display:flex; flex-wrap:wrap;">
        <div style="width:100%; max-width:600px; min-height:calc(100vh - 120px); display:flex; flex-direction:column;">

          <h5 class="mb-4 text-primary text-start">Foto de perfil</h5>

          <div class="d-flex mb-4">
            <div class="avatar-wrap">
              <div class="avatar-circle">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>

            </div>
          </div>

          <h5 class="mb-4 text-primary text-start" style="margin-top:30px;">Dados pessoais</h5>

          <div style="max-width:400px; display:flex; flex-direction:column; gap:0;">
            <label class="field" style="margin-top:15px;">
              <span class="field-label">Nome completo</span>
              <input class="input" type="text" value="Karla Moreira" disabled />
            </label>
            <label class="field" style="margin-top:24px;">
              <span class="field-label">E-mail</span>
              <input class="input" type="email" value="karla.moreira@email.com" disabled />
            </label>
            <button class="btn-primary" style="margin-top:32px; width:100%; max-width:400px; height:50px;">
              Alterar senha
            </button>
          </div>

          <div class="logout-row">
