<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu Perfil · Admin · Lets Redação</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/platform.css" />
  <link rel="stylesheet" href="../styles/admin.css" />
</head>
<body>
  <div class="app-shell"><aside class="sidebar">
      <div class="sidebar-logo" role="img" aria-label="Lets Redação"></div>
            <nav class="sidebar-nav">
        <a href="inicio.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span>Início</span></a>
        <a href="cursos.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg><span>Cursos/Conteúdos</span></a>
        <a href="modulos.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Módulos</span></a>
        <a href="temas.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg><span>Temas</span></a>
        <a href="correcao.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Correção</span></a>
      </nav>
      <div class="sidebar-foot">
        <a href="perfil.html" class="sidebar-item is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>Meu Perfil</span></a>
      </div>
    </aside>
    <main class="content admin-content">
      <h2 class="section-title">Meu Perfil</h2>

      <div class="profile-tabs" style="display:flex; gap:32px; border-bottom:1px solid var(--border-default); margin-bottom:36px; max-width:520px;">
        <button class="profile-tab is-active">Foto de Perfil</button>
        <button class="profile-tab">Dados pessoais</button>
        <button class="profile-tab">Segurança</button>
      </div>

      <form class="profile-form">
        <div class="profile-photo">
          <div class="avatar-stack">
            <div class="avatar-blob" style="display:flex;align-items:center;justify-content:center;background:var(--neutral-200);">
              <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.7917 21.875V19.7917C19.7917 18.6866 19.3527 17.6268 18.5713 16.8454C17.7899 16.064 16.7301 15.625 15.625 15.625H9.375C8.26993 15.625 7.21013 16.064 6.42872 16.8454C5.64732 17.6268 5.20834 18.6866 5.20834 19.7917V21.875M16.6667 7.29167C16.6667 9.59285 14.8012 11.4583 12.5 11.4583C10.1988 11.4583 8.33334 9.59285 8.33334 7.29167C8.33334 4.99048 10.1988 3.125 12.5 3.125C14.8012 3.125 16.6667 4.99048 16.6667 7.29167Z"/></svg>
            </div>
            <button type="button" class="avatar-edit" aria-label="Trocar foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
          </div>
        </div>

        <label class="field">
          <span class="field-label">Nome completo</span>
          <input type="text" value="Vitor Augusto Caires" />
        </label>

        <label class="field">
          <span class="field-label">E-mail</span>
          <input type="email" value="vitorcaires10@gmail.com" disabled />
        </label>

        <h3 class="form-section-title">Segurança</h3>

        <label class="field">
          <span class="field-label">Senha atual</span>
          <input type="password" placeholder="Digite sua senha atual" />
        </label>

        <label class="field">
          <span class="field-label">Nova senha</span>
          <input type="password" placeholder="Digite sua nova senha" />
        </label>

        <button type="button" class="btn-primary" style="width:316px; height:50px; margin-top:14px;">Alterar senha</button>
        <button type="button" class="btn-text-danger" style="margin-top:14px;">Sair da conta</button>
      </form>
    </main>
  </div>
</body>
</html>
