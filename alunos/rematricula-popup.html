  <link rel="stylesheet" href="../styles/tokens.css" />

  <style>
    a { color: inherit; text-decoration: none; }
    .notif-carousel { max-width: 600px; }
    .notif-img {
      width: 100%; aspect-ratio: 16/9; border-radius: 12px;
      object-fit: cover; background: var(--brand-blue);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ─── Pop-up promocional: Rematrícula ─── */
    .promo-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .promo-overlay.is-open { display: flex; }
    .promo-modal {
      background: var(--neutral-0); border-radius: var(--radius-xl);
      width: 100%; max-width: 480px; overflow: hidden;
      box-shadow: var(--shadow-deep); position: relative;
    }
    .promo-close {
      position: absolute; top: 14px; right: 14px; width: 34px; height: 34px;
      border-radius: 50%; border: 0; background: rgba(0,0,0,0.35); color: white;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; z-index: 2;
    }
    .promo-close:hover { background: rgba(0,0,0,0.55); }
    .promo-close svg { width: 18px; height: 18px; }
    .promo-img {
      width: 100%; aspect-ratio: 16/10; object-fit: cover;
      background: linear-gradient(135deg, #1686D8, #0E93F2);
      display: flex; align-items: center; justify-content: center;
    }
    .promo-body { padding: 26px 28px 28px; text-align: center; }
    .promo-body h2 {
      font-family: var(--font-display); font-weight: 700; font-size: 22px;
      color: var(--neutral-900); margin: 0 0 8px;
    }
    .promo-body p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin: 0 0 22px; }
    .promo-actions { display: flex; flex-direction: column; gap: 10px; }
    .promo-actions .btn-primary { width: 100%; }
    .promo-actions .later {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      background: none; border: 0; cursor: pointer; padding: 6px;
    }
    .promo-actions .later:hover { color: var(--text-secondary); }

    @media (max-width: 900px) {
      .promo-modal { max-width: 100%; }
      .promo-body { padding: 22px 20px 24px; }
    }
  </style>
</head>

      </div>

  <script>
    (function () {
      var overlay = document.getElementById('promoOverlay');
      function close() { overlay.classList.remove('is-open'); }
      document.getElementById('promoClose').addEventListener('click', close);
      document.getElementById('promoLater').addEventListener('click', close);
    })();
  </script>
